<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素大陆 · 2D 沙盒生存</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family:"Microsoft YaHei","PingFang SC",monospace; user-select:none;
    -webkit-user-select:none; }
  #game { display:block; width:100vw; height:100vh; image-rendering:pixelated; cursor:crosshair; }

  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(4,6,14,.82); z-index:50; }
  .hidden { display:none !important; }

  .panel { background:rgba(16,20,32,.96); border:3px solid #4a3a28; border-radius:10px;
    padding:28px 34px; color:#e8dcc0; max-width:640px; box-shadow:0 0 60px rgba(0,0,0,.8); }
  .panel h1 { font-size:34px; color:#f2c84b; text-align:center; letter-spacing:6px;
    text-shadow:0 3px 0 #7a5a10, 0 0 24px rgba(242,200,75,.4); margin-bottom:6px; }
  .panel h2 { font-size:15px; color:#9fb4d8; text-align:center; font-weight:normal; margin-bottom:20px; }
  .ctrl-grid { display:grid; grid-template-columns:auto 1fr; gap:7px 18px; font-size:14px;
    line-height:1.5; margin:0 auto 20px; width:fit-content; }
  .key { background:#2a3040; border:1px solid #556; border-bottom-width:3px; border-radius:5px;
    padding:1px 9px; color:#ffd97a; font-weight:bold; text-align:center; white-space:nowrap; }
  .btn { display:block; margin:14px auto 0; background:linear-gradient(#5a8a3a,#3f6a28);
    border:2px solid #79b356; border-bottom-width:5px; border-radius:8px; color:#fff;
    font-size:19px; padding:10px 44px; cursor:pointer; letter-spacing:4px; }
  .btn:hover { filter:brightness(1.15); }
  .btn:active { transform:translateY(2px); border-bottom-width:2px; }
  .seedline { text-align:center; color:#8a94a8; font-size:13px; margin-top:12px; }
  .seedline a { color:#7ab3ff; cursor:pointer; text-decoration:underline; }

  #deathPanel h1 { color:#e0533d; text-shadow:0 3px 0 #6a1a10; }

  /* 背包 + 合成面板 */
  #invPanel { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    background:rgba(14,17,28,.96); border:3px solid #4a3a28; border-radius:10px;
    padding:16px 18px; z-index:40; display:flex; gap:18px; color:#e8dcc0; }
  #invPanel h3 { font-size:14px; color:#f2c84b; margin-bottom:8px; letter-spacing:2px; }
  #invGrid { display:grid; grid-template-columns:repeat(10,44px); gap:4px; }
  .slot { width:44px; height:44px; background:rgba(40,44,60,.9); border:2px solid #555a6a;
    border-radius:5px; position:relative; cursor:pointer; display:flex; align-items:center;
    justify-content:center; }
  .slot:hover { border-color:#f2c84b; }
  .slot.hot { border-color:#8a94a8; }
  .slot .cnt { position:absolute; right:2px; bottom:0; font-size:11px; color:#fff;
    text-shadow:1px 1px 0 #000; pointer-events:none; }
  .slot canvas { image-rendering:pixelated; }
  #craftList { width:250px; max-height:330px; overflow-y:auto; }
  #craftList::-webkit-scrollbar { width:8px; } 
  #craftList::-webkit-scrollbar-thumb { background:#4a3a28; border-radius:4px; }
  .recipe { display:flex; align-items:center; gap:8px; background:rgba(40,44,60,.75);
    border:2px solid #555a6a; border-radius:6px; padding:5px 8px; margin-bottom:6px; }
  .recipe.ok { border-color:#79b356; cursor:pointer; }
  .recipe.ok:hover { background:rgba(60,90,50,.8); }
  .recipe.no { opacity:.55; }
  .recipe .rname { font-size:13px; color:#ffe9b0; }
  .recipe .rreq { font-size:11px; color:#9fb4d8; }
  .recipe .rreq .lack { color:#ff7a6a; }
  .recipe .st { font-size:10px; color:#c9a2ff; }
  .panel-tip { position:absolute; right:12px; top:10px; color:#667; font-size:12px; }

  /* 提示气泡 */
  #toast { position:fixed; top:64px; left:50%; transform:translateX(-50%);
    background:rgba(10,12,22,.85); border:2px solid #4a3a28; border-radius:8px;
    color:#ffe9b0; font-size:15px; padding:7px 20px; z-index:30; pointer-events:none;
    opacity:0; transition:opacity .25s; white-space:nowrap; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="toast"></div>

<!-- 开始界面 -->
<div id="startPanel" class="overlay">
  <div class="panel">
    <h1>像 素 大 陆</h1>
    <h2>Terraria 风格 · 2D 侧视沙盒生存</h2>
    <div class="ctrl-grid">
      <span class="key">A / D</span><span>左右移动</span>
      <span class="key">空格 / W</span><span>跳跃</span>
      <span class="key">鼠标左键</span><span>挖掘(持镐) · 放置(持方块) · 攻击(持剑)</span>
      <span class="key">滚轮 / 1-0</span><span>切换快捷栏</span>
      <span class="key">E / Tab</span><span>背包与合成</span>
      <span class="key">H</span><span>帮助</span>
    </div>
    <div style="font-size:13px;color:#b8a888;line-height:1.8;text-align:center">
      白天砍树挖矿、采集煤 / 铁 / 金矿，合成镐与剑，用火把照亮洞穴。<br>
      夜晚僵尸出没 —— 建好你的房子，活下去！
    </div>
    <button class="btn hidden" id="continueBtn" style="background:linear-gradient(#4a6a9a,#33486e);border-color:#6a8abe">继 续 游 戏</button>
    <button class="btn" id="startBtn">开 始 游 戏</button>
    <div class="seedline">世界种子:<span id="seedText"></span> · <a id="reseed">换一个世界</a></div>
  </div>
</div>

<!-- 死亡界面 -->
<div id="deathPanel" class="overlay hidden">
  <div class="panel" style="text-align:center">
    <h1>你 死 了</h1>
    <h2 id="deathInfo"></h2>
    <button class="btn" id="respawnBtn">重 生</button>
  </div>
</div>

<!-- 背包 / 合成 -->
<div id="invPanel" class="hidden">
  <div class="panel-tip">E 关闭</div>
  <div>
    <h3>背包（点击与选中快捷栏交换）</h3>
    <div id="invGrid"></div>
  </div>
  <div>
    <h3 id="craftTitle">合成</h3>
    <div id="craftList"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
